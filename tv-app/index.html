<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>CKast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050607;
            color: #f5f7f7;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: block;
            z-index: 1;
        }

        #connectOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            background: #050607;
            -webkit-transition: opacity 0.45s ease;
            transition: opacity 0.45s ease;
        }

        #connectOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .receiver-shell {
            width: 820px;
            max-width: 86vw;
            padding: 48px 52px;
            border: 1px solid rgba(245, 247, 247, 0.14);
            border-radius: 8px;
            background: rgba(15, 17, 18, 0.96);
            box-shadow: 0 18px 70px rgba(0, 0, 0, 0.42);
        }

        .brand-area {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            margin-bottom: 38px;
        }

        .brand-mark {
            width: 72px;
            height: 72px;
            line-height: 72px;
            margin-right: 22px;
            border-radius: 8px;
            background: #e5ebe7;
            color: #050607;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .eyebrow {
            margin-bottom: 8px;
            color: #80c793;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 42px;
            line-height: 1.1;
            font-weight: 650;
            letter-spacing: 0;
        }

        .connect-form {
            margin-bottom: 28px;
        }

        .connect-form label {
            display: block;
            margin-bottom: 10px;
            color: #b6bebc;
            font-size: 17px;
            font-weight: 600;
        }

        .address-row {
            display: -webkit-flex;
            display: flex;
            width: 100%;
        }

        #serverIpInput {
            -webkit-flex: 1 1 auto;
            flex: 1 1 auto;
            min-width: 0;
            height: 62px;
            padding: 0 20px;
            border: 1px solid #46504d;
            border-right: 0;
            border-radius: 8px 0 0 8px;
            background: #090b0c;
            color: #f5f7f7;
            font-size: 28px;
            font-weight: 650;
            letter-spacing: 0;
            outline: none;
        }

        #serverIpInput:focus {
            border-color: #80c793;
            box-shadow: inset 0 0 0 1px #80c793;
        }

        #connectButton {
            -webkit-flex: 0 0 168px;
            flex: 0 0 168px;
            height: 62px;
            border: 1px solid #80c793;
            border-radius: 0 8px 8px 0;
            background: #80c793;
            color: #051008;
            font-size: 22px;
            font-weight: 800;
            outline: none;
        }

        #connectButton:focus {
            box-shadow: 0 0 0 4px rgba(128, 199, 147, 0.28);
        }

        #connectStatus {
            min-height: 30px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            color: #c8cfcd;
            font-size: 18px;
            font-weight: 500;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 12px;
            border-radius: 50%;
            background: #80c793;
            -webkit-animation: dotpulse 1.5s ease-in-out infinite;
            animation: dotpulse 1.5s ease-in-out infinite;
        }

        .status-footer {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid rgba(245, 247, 247, 0.1);
            color: #77807d;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @-webkit-keyframes dotpulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }

        @keyframes dotpulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <video id="screenVideo" autoplay muted></video>

    <div id="connectOverlay">
        <main class="receiver-shell">
            <div class="brand-area">
                <div class="brand-mark">CK</div>
                <div>
                    <p class="eyebrow">CKast Receiver</p>
                    <h1>Ready for local stream</h1>
                </div>
            </div>

            <form id="serverForm" class="connect-form">
                <label for="serverIpInput">PC address</label>
                <div class="address-row">
                    <input id="serverIpInput" name="serverIp" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.10">
                    <button id="connectButton" type="submit">Connect</button>
                </div>
            </form>

            <p id="connectStatus">
                <span class="dot"></span>
                <span id="connectStatusText">Enter your PC address to connect.</span>
            </p>

            <div class="status-footer">
                <span>Local network</span>
                <span>Port 8080</span>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
